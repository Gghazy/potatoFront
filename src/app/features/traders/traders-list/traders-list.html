<div class="page">
  <div class="page-toolbar mb-4">
    <div>
      <h2 class="mb-1">🤝 التجار</h2>
      <p class="text-muted mb-0">دفتر عناوين التجار اللى بنبيع لهم</p>
    </div>
    <button class="btn btn-primary" (click)="openAdd()">
      <i class="bi bi-plus-lg"></i>
      <span class="ms-1">إضافة تاجر</span>
    </button>
  </div>

  <div class="filter-bar mb-3">
    <div class="filter-bar__field filter-bar__field--grow">
      <i class="bi bi-search"></i>
      <input type="text" class="form-control" placeholder="بحث بالاسم أو رقم التليفون..."
             [ngModel]="search()" (ngModelChange)="onSearchInput($event)" />
    </div>
    <button type="button" class="btn btn-secondary" (click)="resetSearch()" [disabled]="!hasSearch()">
      <i class="bi bi-x-circle"></i> مسح
    </button>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>الاسم</th>
            <th>رقم التليفون</th>
            <th>تاريخ الإضافة</th>
            <th class="text-center">إجراءات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of traders()">
            <td class="text-muted">{{ t.id }}</td>
            <td class="fw-semibold">{{ t.name }}</td>
            <td>
              <a *ngIf="t.phoneNumber" [href]="'tel:' + t.phoneNumber" class="text-decoration-none">
                <i class="bi bi-telephone"></i> {{ t.phoneNumber }}
              </a>
              <span *ngIf="!t.phoneNumber" class="text-muted">—</span>
            </td>
            <td>{{ t.createdAt | date:'yyyy-MM-dd' }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-info me-1" (click)="edit(t)">
                <i class="bi bi-pencil"></i> تعديل
              </button>
              <button class="btn btn-sm btn-danger" (click)="askDelete(t.id)">
                <i class="bi bi-trash"></i> حذف
              </button>
            </td>
          </tr>
          <tr *ngIf="traders().length === 0 && !loading()">
            <td colspan="5" class="empty-state py-5 text-center">
              <div class="empty-state__icon">🤝</div>
              <div>{{ hasSearch() ? 'لا توجد نتائج مطابقة' : 'لا يوجد تجار مسجَّلين بعد' }}</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <app-form-modal
    [open]="showModal()"
    [title]="editingId() !== null ? 'تعديل بيانات تاجر' : 'إضافة تاجر جديد'"
    [saveLabel]="editingId() !== null ? 'تحديث' : 'إضافة'"
    [saving]="saving()"
    size="lg"
    (save)="save()"
    (cancel)="cancel()">
    <div class="row g-3">
      <div class="col-md-12">
        <label class="form-label">اسم التاجر</label>
        <input type="text" class="form-control" [ngModel]="form().name"
               (ngModelChange)="updateForm('name', $event)" placeholder="مثال: محمد التاجر" />
      </div>
      <div class="col-md-12">
        <label class="form-label">رقم التليفون <span class="text-muted small">(اختيارى — رقم مصرى)</span></label>
        <input type="tel" class="form-control" dir="ltr" maxlength="11"
               [ngModel]="form().phoneNumber"
               (ngModelChange)="updateForm('phoneNumber', $event)"
               placeholder="01012345678" />
      </div>
    </div>
  </app-form-modal>

  <app-confirm-delete-modal
    [open]="deleteId() !== null"
    title="تأكيد حذف التاجر"
    message="هل أنت متأكد من حذف هذا التاجر؟"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()">
  </app-confirm-delete-modal>
</div>
