<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <div class="auth-card__logo">🥔</div>
      <h2 class="auth-card__title">تسجيل الدخول</h2>
      <p class="auth-card__subtitle">أهلاً بعودتك، سجِّل دخولك للمتابعة</p>
    </div>

    <form (ngSubmit)="submit()" #f="ngForm" class="auth-form">
      <div class="mb-3">
        <label class="form-label">رقم التليفون</label>
        <input type="tel" class="form-control" name="phoneNumber" [(ngModel)]="phoneNumber" required
               placeholder="01012345678" autocomplete="username" dir="ltr" />
      </div>

      <div class="mb-3">
        <label class="form-label">كلمة المرور</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required
               placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-auth" [disabled]="loading()">
        {{ loading() ? 'جارٍ الدخول…' : 'دخول' }}
      </button>
    </form>
  </div>
</div>
